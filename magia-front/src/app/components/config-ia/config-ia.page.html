<ion-content>

  <div class="container">

    <!-- topo mágico -->
    <div class="magic-header">
      <h2>{{tipoLabel[tipo]}}</h2>
      <p>Escolha como deseja aprender hoje</p>
    </div>

    <!-- card principal -->
    <div class="magic-card">

      <!-- nível -->
      <div class="field">
        <label>&#x1F9E0; Nível</label>
        <select [(ngModel)]="nivel">
          @for(nivel of niveis; track $index){
            <option value="{{nivel}}">{{nivel}}</option>
          }
        </select>
      </div>

      <!-- tema -->
      <div class="field">
        <label>&#x1F30D; Tema</label>
        <input
          type="text"
          [(ngModel)]="tema"
          maxlength="100"
          placeholder="Ex: viagem, trabalho..." />
      </div>

      <!-- quantidade -->
      <div class="field">
        <label>&#x1F522; Quantidade</label>
        <div class="chips">
          @for(q of [5,10,15]; track q){
            <button
              [class.active]="quantidade === q"
              (click)="quantidade = q">
              {{q}}
            </button>
          }
        </div>
      </div>

    </div>

    <!-- botão -->
    <div class="div-button">
      <button class="btn magia iniciar" (click)="start()">
        ✨ Gerar Atividade
      </button>
    </div>

    <!-- boneca -->
    <div class="doll-container">
      <img src="../../assets/images/magia.png" class="magic-doll" />
    </div>

  </div>

  <!-- <button (click)="voltar()">
  VOLTAR TESTE
</button> -->

</ion-content>
