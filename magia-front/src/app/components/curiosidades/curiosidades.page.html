<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>curiosidades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">curiosidades</ion-title>
    </ion-toolbar>
  </ion-header>
  @for(curiosidade of curiosidades; track curiosidade.id){
    <ion-card (click)="openCuriosityDetail(curiosidade.id)">
      <img  [src]="curiosidade.img_header" />
      <ion-card-header>
        <ion-card-title>{{curiosidade.title}}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        Here's a small text description for the card content. Nothing more, nothing less.
      </ion-card-content>
    </ion-card>
  }

</ion-content>
