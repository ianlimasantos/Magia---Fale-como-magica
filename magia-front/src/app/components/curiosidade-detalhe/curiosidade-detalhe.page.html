<ion-content *ngIf="curiosidade">

  <img [src]="curiosidade.img_header" />

  <h1>{{ curiosidade.title }}</h1>

  <p>{{ curiosidade.textPart1 }}</p>

  <img *ngIf="curiosidade.img_middle" [src]="curiosidade.img_middle" />

  <p *ngIf="curiosidade.textPart2">
    {{ curiosidade.textPart2 }}
  </p>

  <img *ngIf="curiosidade.img_bottom" [src]="curiosidade.img_bottom" />

</ion-content>
