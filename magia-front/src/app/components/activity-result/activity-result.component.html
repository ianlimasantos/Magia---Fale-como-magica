<div class="activity-results">

  <div class="result-card">

    <div class="result-header">
      <h3>{{ userActivityProgress?.theme }}</h3>
    </div>

    <div class="result-stats">

      <div class="stat">
        <span class="value">{{ userActivityProgress?.percentage }}%</span>
        <span class="label">Taxa de acerto</span>
      </div>

      <div class="stat">
        <span class="value">{{ userActivityProgress?.score }}</span>
        <span class="label">Score</span>
      </div>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        [style.width.%]="userActivityProgress?.percentage">
      </div>
    </div>
  </div>
</div>
