<div class="activity-results">

  <div class="result-card">

    <div class="result-header">
      <h3>{{ userActivityProgress?.theme }}</h3>
      @if(userActivityProgress?.curiosity){
        <button class="curiosity-btn"   (click)="$event.stopPropagation(); showModalCuriosidade()">
          &#10024; Reler Curiosidade
        </button>
      }
    </div>

    <div class="result-stats">

      <div class="stat">
        <span class="value">{{ userActivityProgress?.percentage }}%</span>
        <span class="label">Taxa de acerto</span>
      </div>

      <div class="stat">
        <span class="value">{{ userActivityProgress?.score }}</span>
        <span class="label">Score</span>
      </div>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        [style.width.%]="userActivityProgress?.percentage">
      </div>
    </div>
  </div>
</div>

<ion-modal
  [isOpen]="isModalCuriosidadeOpen"
  cssClass="magic-modal">

  <ng-template>
    <ion-header class="magic-header">
      <ion-toolbar>

        <ion-title>
          Curiosidade
        </ion-title>

          <button class="close-btn" (click)="closeModal()">
            &times;
          </button>

      </ion-toolbar>
    </ion-header>

    <ion-content class="magic-content">

      <div class="curiosity-card">
        <p>{{ userActivityProgress?.curiosity }}</p>
      </div>
    </ion-content>
  </ng-template>

</ion-modal>
